name: Windows core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test core behavior without credentials or external services
        run: >-
          python -m pytest -q tests/test_core.py tests/test_tracking.py
          tests/test_translation.py tests/test_video.py tests/test_live.py tests/test_single_line.py
